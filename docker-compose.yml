version: "3.9"

services:
  db:
    image: postgres:17
    container_name: taskdb
    restart: always

    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev

    ports:
      - "5432:5432"

    volumes:
      - taskdata:/var/lib/postgresql/data

  app:
    build: .

    container_name: fastapi-app

    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: tasks
      DB_USER: postgres
      DB_PASSWORD: dev

    ports:
      - "8000:8000"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  taskdata: